<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UnitTwin — Trace Tool</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      color: white;
      font-family: sans-serif;
    }
    #toolbar {
      padding: 12px;
      background: #222;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    #canvas-container {
      overflow: auto;
      width: 100vw;
      height: calc(100vh - 56px);
    }
    canvas {
      display: block;
    }
    button {
      padding: 6px 12px;
      cursor: pointer;
    }
    #status {
      flex-basis: 100%;
      opacity: 0.85;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <input type="file" id="image-input" accept="image/*" />

    <button id="calibrate-btn" style="display: none;">Calibrate</button>

    <button id="trace-walls-btn" style="display: none;">Trace Walls</button>
    <button id="new-wall-chain-btn" style="display: none;">New Wall Chain</button>
    <button id="finish-walls-btn" style="display: none;">Finish Walls</button>

    <button id="mark-doors-btn" style="display: none;">Mark Doors</button>
    <button id="done-doors-btn" style="display: none;">Done Adding Doors</button>

    <button id="define-room-btn" style="display: none;">Define Room</button>
    <button id="finish-room-btn" style="display: none;">Finish This Room</button>
    <button id="cancel-room-btn" style="display: none;">Cancel Room</button>

    <button id="undo-btn" style="display: none;">Undo</button>

    <button id="start-over-btn">Start Over</button>
    <button id="preview-3d-btn">Preview in 3D</button>

    <span id="status">Load a floor plan image to begin.</span>
  </div>

  <div id="canvas-container">
    <canvas id="trace-canvas"></canvas>
  </div>

  <script type="module" src="/src/trace/traceMain.js"></script>

</body>
</html>
