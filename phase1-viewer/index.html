<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnitTwin — Phase 1 Viewer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #111;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 20px;
        z-index: 10;
        pointer-events: none;
      }
      #ui-panel {
        position: fixed;
        top: 16px;
        left: 16px;
        background: rgba(20, 20, 20, 0.85);
        color: white;
        padding: 12px;
        border-radius: 8px;
        font-family: sans-serif;
        font-size: 13px;
        z-index: 10;
        max-width: 260px;
        display: none;
      }
      #ui-panel.visible {
        display: block;
      }
      .ui-section-label {
        margin-top: 10px;
        margin-bottom: 4px;
        font-weight: bold;
      }
      .ui-button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .ui-btn {
        padding: 4px 8px;
        cursor: pointer;
      }
      .ui-btn.selected {
        outline: 2px solid #4488ff;
      }
      .ui-swatch {
        width: 28px;
        height: 28px;
        border-radius: 4px;
        border: 1px solid #666;
        cursor: pointer;
      }
      .ui-swatch:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair">+</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
